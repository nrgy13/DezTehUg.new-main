name: Import Regina clients to PROD

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: 'gzip+base64 от tmp/regina-clients.json (~18K)'
        required: true
        type: string
      reset:
        description: 'Снести ВСЕХ клиентов перед импортом? (опасно!)'
        required: true
        default: false
        type: boolean
      with_test:
        description: 'Создать тестового менеджера + 5 тестовых клиентов?'
        required: true
        default: true
        type: boolean

concurrency:
  group: import-regina-prod
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH config (skip strict host check)
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User root
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Decode payload and upload
        run: |
          echo "${{ inputs.payload_b64 }}" | base64 -d | gunzip > /tmp/regina-clients.json
          echo "── decoded ──"
          wc -l /tmp/regina-clients.json
          head -c 200 /tmp/regina-clients.json
          echo
          scp /tmp/regina-clients.json vps:/tmp/regina-clients.json

      - name: Run import inside app container
        run: |
          FLAGS=""
          if [ "${{ inputs.reset }}" = "true" ]; then FLAGS="$FLAGS --reset"; fi
          if [ "${{ inputs.with_test }}" = "true" ]; then FLAGS="$FLAGS --with-test"; fi
          echo "── Flags: $FLAGS ──"
          ssh vps "set -e
            cd /opt/deztech-crm
            git fetch origin feature/crm
            git reset --hard origin/feature/crm
            mkdir -p tmp
            cp /tmp/regina-clients.json tmp/regina-clients.json
            # Запустим импорт через one-shot контейнер с tsx
            docker compose -f docker-compose.prod.yml --env-file .env run --rm \
              -v \$(pwd)/tmp/regina-clients.json:/app/tmp/regina-clients.json:ro \
              app npx tsx tools/import-regina-clients.ts $FLAGS
          "

      - name: Verify import
        run: |
          ssh vps "
            docker exec deztech-crm-postgres psql -U deztech deztech_crm -c \"
              SELECT u.email AS manager, COUNT(DISTINCT c.id) AS clients
              FROM users u
              LEFT JOIN clients c ON c.assigned_manager_id = u.id
              WHERE u.role = 'manager'
              GROUP BY u.email
              ORDER BY clients DESC;
            \"
          "
