name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Ветка для деплоя'
        required: true
        default: 'feature/crm'
        type: string
      run_migrations:
        description: 'Применить новые миграции?'
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Pull and rebuild on VPS
        run: |
          ssh root@${{ secrets.VPS_HOST }} "set -e
            cd /opt/deztech-crm
            echo '── git fetch + reset ──'
            git fetch origin '${{ inputs.branch }}'
            git reset --hard 'origin/${{ inputs.branch }}'
            echo '── docker build ──'
            docker compose -f docker-compose.prod.yml --env-file .env build app
            echo '── docker up ──'
            docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate app
          "

      - name: Apply migrations
        if: ${{ inputs.run_migrations }}
        run: |
          ssh root@${{ secrets.VPS_HOST }} "set -e
            cd /opt/deztech-crm
            for f in drizzle/migrations/*.sql; do
              fname=\$(basename \"\$f\")
              echo \"-- Applying \$fname --\"
              docker cp \"\$f\" deztech-crm-postgres:/tmp/m.sql
              docker exec -i deztech-crm-postgres psql -U deztech deztech_crm -f /tmp/m.sql
            done
          "

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf https://crm.xn--c1abdaj0ewa6e.xn--p1ai/api/health 2>/dev/null \
               || curl -sf https://crm.xn--c1abdaj0ewa6e.xn--p1ai/login >/dev/null 2>&1; then
              echo "✅ App responds"
              exit 0
            fi
            echo "Attempt $i/5 failed, retry in 10s..."
            sleep 10
          done
          echo "❌ App not responding after deploy"
          exit 1
