# =====================================================
# Prod docker-compose для VPS Beget
# Стек: Traefik + Postgres + Redis + Next.js + LibreOffice
#
# Размещение: /opt/deztech-crm/
# Запуск:     docker compose -f docker-compose.prod.yml up -d
# =====================================================

name: deztech-crm

networks:
  web:
    external: true   # внешняя сеть для Traefik (создать вручную: docker network create web)
  internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  traefik-acme:
  app-storage:       # временные DOCX/PDF перед заливкой в S3

services:
  # ---------- Traefik (HTTPS reverse proxy) ----------
  traefik:
    image: traefik:v3
    container_name: deztech-crm-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    networks:
      - web

  # ---------- PostgreSQL 16 ----------
  postgres:
    image: postgres:16-alpine
    container_name: deztech-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deztech_crm}
      POSTGRES_USER: ${POSTGRES_USER:-deztech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: deztech-crm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- LibreOffice headless (DOCX → PDF) ----------
  libreoffice:
    image: linuxserver/libreoffice:latest
    container_name: deztech-crm-libreoffice
    restart: unless-stopped
    environment:
      PUID: 1001
      PGID: 1001
      TZ: Europe/Moscow
    volumes:
      - app-storage:/storage
    networks:
      - internal

  # ---------- Next.js приложение ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: deztech-crm-app:latest
    container_name: deztech-crm-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-deztech}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-deztech_crm}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${AUTH_URL}
      NEXT_PUBLIC_APP_NAME: "DezTehYug CRM"
      # S3 (Yandex Object Storage)
      S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-deztechyug-crm}
      S3_FORCE_PATH_STYLE: "true"
      # SMTP (Beget mail)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # n8n integration
      N8N_INBOUND_SECRET: ${N8N_INBOUND_SECRET}
    volumes:
      - app-storage:/app/storage
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # HTTPS-роутер на crm.дезтехюг.рф (+ Punycode)
      - "traefik.http.routers.crm.rule=Host(`${DOMAIN}`) || Host(`${DOMAIN_PUNYCODE}`)"
      - "traefik.http.routers.crm.entrypoints=websecure"
      - "traefik.http.routers.crm.tls=true"
      - "traefik.http.routers.crm.tls.certresolver=letsencrypt"
      - "traefik.http.services.crm.loadbalancer.server.port=3000"
      # Security headers
      - "traefik.http.middlewares.crm-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.crm-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.crm-security.headers.stsPreload=true"
      - "traefik.http.middlewares.crm-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.crm-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.crm-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.crm.middlewares=crm-security"
